[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Lenny Growth Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pgvector>=0.2.0",
    "psycopg2-binary>=2.9.0",
    "sentence-transformers>=2.0.0",
    "tiktoken>=0.5.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "claude_agent_sdk>=1.0.0",
    "anthropic>=0.30.0",
    "httpx>=0.24.0",
    "bleach>=6.1.0",
    "sse-starlette>=1.6.1"
]

[tool.setuptools]
py-modules = ["main", "models"]
